<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12343b" />
    <title>ماموریت روزانه</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily Quest</p>
          <h1>ماموریت روزانه</h1>
        </div>
        <button class="icon-button" id="installBtn" type="button" title="نصب روی گوشی" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
          </svg>
        </button>
      </header>

      <main>
        <section class="screen active" id="onboardingScreen">
          <div class="intro-band">
            <div class="intro-copy">
              <span class="badge">شروع بازی</span>
              <h2>چند جواب کوتاه بده تا پنل روزانه‌ات ساخته شود.</h2>
              <p>برنامه بر اساس کار، ورزش، سن، قد، وزن و هدف تو ساخته می‌شود. بعدا همه آیتم‌ها قابل ویرایش هستند.</p>
            </div>
            <div class="quest-token" aria-hidden="true">
              <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" />
                <path d="M34 64 52 82l36-45" />
              </svg>
            </div>
          </div>

          <form class="setup-form" id="profileForm">
            <label>
              نوع کار یا بیزینس
              <input name="business" required placeholder="مثلا فروشگاه آنلاین، برنامه‌نویسی، رستوران" />
            </label>
            <label>
              هدف اصلی کاری
              <input name="workGoal" required placeholder="مثلا افزایش فروش، تولید محتوا، یادگیری" />
            </label>
            <div class="field-grid">
              <label>
                سن
                <input name="age" type="number" min="12" max="90" required placeholder="28" />
              </label>
              <label>
                قد
                <input name="height" type="number" min="90" max="230" required placeholder="175" />
              </label>
              <label>
                وزن
                <input name="weight" type="number" min="30" max="250" required placeholder="80" />
              </label>
            </div>
            <label>
              ورزش یا فعالیت بدنی
              <select name="sport">
                <option value="پیاده‌روی">پیاده‌روی</option>
                <option value="بدنسازی">بدنسازی</option>
                <option value="دویدن">دویدن</option>
                <option value="شنا">شنا</option>
                <option value="یوگا">یوگا</option>
                <option value="تمرین خانگی">تمرین خانگی</option>
              </select>
            </label>
            <label>
              هدف سلامتی
              <select name="healthGoal">
                <option value="کاهش وزن">کاهش وزن</option>
                <option value="افزایش انرژی">افزایش انرژی</option>
                <option value="عضله‌سازی">عضله‌سازی</option>
                <option value="ثبات و نظم">ثبات و نظم</option>
              </select>
            </label>
            <label>
              جریمه پیشنهادی اگر ماموریت از زمانش گذشت
              <input name="penalty" type="number" min="1000" step="1000" value="50000" />
            </label>
            <button class="primary-action" type="submit">ساخت پنل من</button>
          </form>
        </section>

        <section class="screen" id="dashboardScreen">
          <div class="stats-grid">
            <article class="stat-card">
              <span>امتیاز</span>
              <strong id="scoreValue">0</strong>
            </article>
            <article class="stat-card green">
              <span>سکه</span>
              <strong id="coinValue">0</strong>
            </article>
            <article class="stat-card amber">
              <span>زنجیره</span>
              <strong id="streakValue">0</strong>
            </article>
          </div>

          <div class="panel-head">
            <div>
              <p class="eyebrow" id="todayLabel">امروز</p>
              <h2>برنامه ۲۴ ساعته</h2>
            </div>
            <div class="head-actions">
              <button class="ghost-button" id="resetTodayBtn" type="button">روز جدید</button>
              <button class="icon-button" id="editProfileBtn" type="button" title="ویرایش مشخصات">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
              </button>
            </div>
          </div>

          <section class="timeline" id="taskList" aria-live="polite"></section>

          <form class="task-editor" id="taskForm">
            <input type="hidden" name="id" />
            <label>
              عنوان ماموریت
              <input name="title" required placeholder="مثلا تماس با ۵ مشتری" />
            </label>
            <div class="field-grid two">
              <label>
                زمان
                <input name="time" type="time" required />
              </label>
              <label>
                نوع
                <select name="category">
                  <option value="work">کار</option>
                  <option value="sport">ورزش</option>
                  <option value="health">سلامتی</option>
                  <option value="learn">یادگیری</option>
                  <option value="life">زندگی</option>
                </select>
              </label>
            </div>
            <label>
              جریمه دیرکرد
              <input name="penalty" type="number" min="0" step="1000" />
            </label>
            <div class="form-actions">
              <button class="primary-action" type="submit">ذخیره ماموریت</button>
              <button class="ghost-button" id="cancelEditBtn" type="button">لغو</button>
            </div>
          </form>

          <section class="ledger">
            <div class="panel-head compact">
              <h2>دفتر پاداش و جریمه</h2>
              <button class="ghost-button" id="clearLogBtn" type="button">پاک کردن</button>
            </div>
            <div id="logList" class="log-list"></div>
          </section>
        </section>
      </main>
    </div>

    <template id="taskTemplate">
      <article class="task-row">
        <div class="time-chip"></div>
        <div class="task-main">
          <div class="task-title-row">
            <h3></h3>
            <span class="category-pill"></span>
          </div>
          <p class="task-meta"></p>
        </div>
        <div class="task-actions">
          <button class="done-btn" type="button">تیک</button>
          <button class="mini-icon edit-btn" type="button" title="ویرایش">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button class="mini-icon delete-btn" type="button" title="حذف">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2m-1 5v6M9 11v6M5 6l1 15h12l1-15" />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
